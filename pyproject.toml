
[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ft_package"
version = "0.0.1"
description = "My first package creation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "hrazafia", email = "hrazafia@student.42antananarivo.mg" }
]

[project.urls]
Homepage = "https://github.com/hrazafia/ft_package"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

